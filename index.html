    <style>
        /* ------------------------------------------------------------------
           1. CORE DESIGN SYSTEM & THEME TOKENS
        ------------------------------------------------------------------ */
        :root {
            --bg-color: #12141c;       
            --text-color: #e2e8f0;     
            --muted-color: #64748b;    
            --accent-color: #ffffff;   /* Balanced to White by default for Dark Mode */
            --text-glow: 0 0 8px rgba(255,255,255,0.6);
            --font-mono: 'JetBrains Mono', monospace;
            --font-script: 'Courier Prime', monospace;
            --canvas-width: 680px;     
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-mono);
            font-size: 18px;
            line-height: 1.7;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .app-view {
            display: none; 
            height: 100vh;
            width: 100vw;
        }

        .app-view.active {
            display: flex; 
            flex-direction: column;
        }
