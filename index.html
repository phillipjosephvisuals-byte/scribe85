<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scribe85 Workspace</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:ital,wght@0,300;0,400;0,700;1,300;1,700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* ------------------------------------------------------------------
           1. CORE DESIGN SYSTEM & THEME TOKENS
        ------------------------------------------------------------------ */
        :root {
            --bg-color: #12141c;       
            --text-color: #e2e8f0;     
            --muted-color: #64748b;    
            --accent-color: #ffffff;   /* Balanced to White by default for Dark Mode */
            --text-glow: 0 0 8px rgba(255,255,255,0.6);
            --font-mono: 'JetBrains Mono', monospace;
            --font-script: 'Courier Prime', monospace;
            --canvas-width: 680px;     
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-mono);
            font-size: 18px;
            line-height: 1.7;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .app-view {
            display: none; 
            height: 100vh;
            width: 100vw;
        }

        .app-view.active {
            display: flex; 
            flex-direction: column;
        }

        /* ------------------------------------------------------------------
           2. THE LAUNCHPAD LANDING SCREEN
        ------------------------------------------------------------------ */
        #launchpad-view {
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: radial-gradient(circle at center, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.2) 100%), var(--bg-color);
            overflow-y: auto;
            padding: 40px 0;
        }

        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 480px; 
            padding: 0 50px;
            margin-bottom: 15px;
            margin-top: 40px;
        }
 
        .brand-logo-frame {
            width: 100%;
            height: auto; 
            max-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            margin-bottom: 5px;
            margin-top: 15px;
            transition: color 0.4s ease;
        }

        .brand-logo-frame svg {
            width: 75%;
            height: auto;
            fill: currentColor;
        }

        .brand-header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -1px;
            text-align: center;
            text-shadow: var(--text-glow);
        }

        .brand-header p {
            color: var(--muted-color);
            font-size: 1rem;
            text-align: center;
            width: 100%;
            margin-top: 2px;
        }

        /* ------------------------------------------------------------------
           COLLAPSIBLE LAUNCHPAD THEME SELECTION WRAPPER
        ------------------------------------------------------------------ */
        .collapsible-theme-hub {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 760px;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .theme-accordion-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 20px;
            transition: background 0.2s ease;
        }

        .theme-accordion-toggle:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .theme-toggle-label {
            font-size: 0.75rem;
            text-transform: lowercase;
            letter-spacing: 1px;
            color: var(--muted-color);
            font-family: var(--font-mono);
            user-select: none;
        }

        .theme-square-group {
            display: flex;
            gap: 6px;
        }

        .theme-selection-panel {
            display: flex;
            gap: 16px;
            width: 100%;
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, margin-top 0.3s ease;
            margin-top: 0;
        }

        .collapsible-theme-hub.expanded .theme-selection-panel {
            max-height: 120px;
            opacity: 1;
            margin-top: 15px;
        }

        .theme-card {
            flex: 1;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.2s ease;
        }
        
        .t-dark { background: #12141c; color: #e2e8f0; border-color: rgba(255,255,255,0.1); }
        .t-amber { background: #0a0800; color: #ffb000; border-color: #ffb000; text-shadow: 0 0 2px #ffb000; }
        .t-matrix { background: #000500; color: #33ff33; border-color: #33ff33; text-shadow: 0 0 2px #33ff33; }
        .t-cobalt { background: #000080; color: #ffffff; border-color: rgba(255,255,255,0.2); }

        .theme-card:hover { transform: translateY(-2px); }

        /* ------------------------------------------------------------------
           CLEAN STREAMLINED SUITE CARDS
        ------------------------------------------------------------------ */
        .suite-options {
            display: flex;
            gap: 24px;
            max-width: 820px;
            width: 100%;
            padding: 0 20px;
        }

        .suite-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 32px 28px 28px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .suite-card:hover {
            background: rgba(255, 255, 255, 0.035);
            border-color: var(--accent-color);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 12px rgba(255, 255, 255, 0.06);
            transform: translateY(-3px);
        }

        .suite-card-icon-frame {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            margin-bottom: 16px;
            opacity: 0.9;
            transition: color 0.4s ease, transform 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(var(--text-glow));
        }

        .suite-card:hover .suite-card-icon-frame {
            transform: scale(1.08);
            opacity: 1;
        }

        .suite-card-icon-frame svg {
            width: 100%;
            height: 100%;
            color: var(--accent-color);
            transition: color 0.4s ease;
        }

        .suite-card h2 {
            font-size: 1.35rem;
            font-weight: 400;
            margin-bottom: 12px;
            color: var(--text-color);
            text-shadow: var(--text-glow);
            text-align: center;
            letter-spacing: 0.5px;
        }

        .suite-card p.card-desc {
            font-size: 0.83rem;
            color: var(--muted-color);
            line-height: 1.65;
            text-align: justify;
            text-justify: inter-word;
            hyphens: auto;
            width: 100%;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .write-btn-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: auto;
        }

        .suite-write-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-family: var(--font-mono);
            font-size: 0.88rem;
            font-weight: bold;
            text-transform: lowercase;
            letter-spacing: 1.5px;
            padding: 9px 42px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.03);
        }

        .suite-write-btn:hover {
