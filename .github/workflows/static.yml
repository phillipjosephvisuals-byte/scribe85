name: Secure Static Build

# Concurrency setting: Automatically cancels any older queued or in-progress 
# runs on the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    # Global timeout for the entire job (kills the runner if it exceeds 15 minutes)
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build or test script with isolated step timeout
        # Individual step timeout (kills just this command if it hangs for 5 minutes)
        timeout-minutes: 5
        run: npm run build
